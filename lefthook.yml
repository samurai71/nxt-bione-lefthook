# lefthook.yml
commit-msg:
  commands:
    lint-commit-msg:
      run: pnpm commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    # 1. Biome: Fast linting and formatting (No semis, single quotes)
    biome-check:
      glob: '*.{js,ts,jsx,tsx,json}'
      # Added --apply to actually fix the files during the hook
      run: pnpm biome format --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # 2. Prettier: Specifically for Tailwind class sorting
    prettier-style:
      glob: '*.{js,ts,jsx,tsx,css}'
      # This now handles Tailwind AND Import sorting with spaces
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

    # 3. Spell Check: Using your Canadian dictionary
    # spell-check:
    #   glob: '*.{js,jsx,ts,tsx,md,json}'
    # Added --no-summary to keep the output clean in the terminal
    # run: pnpm cspell --no-summary --no-progress {staged_files}
